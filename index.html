<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betrunken — Crossbow Tavern</title>
<style>
  :root {
    --bg: #1a1916;
    --panel: #242220;
    --panel-2: #2f2c28;
    --text: #e8e3d8;
    --text-dim: #9a948a;
    --accent: #c89060;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    z-index: 5;
  }
  .hud-card {
    background: rgba(20,18,16,0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(200,144,96,0.15);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    pointer-events: auto;
  }
  .hud-card h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; }
  .hud-card .sub { color: var(--text-dim); font-size: 12px; }
  .stats { font-variant-numeric: tabular-nums; }
  .stats b { color: var(--accent); font-weight: 600; }

  #controls {
    position: absolute; bottom: 14px; left: 14px; right: 14px;
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    pointer-events: none;
    z-index: 5;
  }
  .ctl {
    background: rgba(20,18,16,0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(200,144,96,0.15);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    pointer-events: auto;
    font-size: 12px;
  }
  .ctl label { color: var(--text-dim); }
  .ctl input[type=range] { accent-color: var(--accent); width: 110px; }
  .ctl .val { font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3733;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { background: #3a3733; }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
    flex-direction: column;
    gap: 14px;
  }
  #loading .ring {
    width: 40px; height: 40px;
    border: 3px solid rgba(200,144,96,0.18);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  #loading .label { color: var(--text-dim); font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 64px; height: 64px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
  }
  #crosshair .ring {
    position: absolute; inset: 0;
    border: 1.5px solid rgba(226,75,74,0.85);
    border-radius: 50%;
    transition: border-color 0.12s;
  }
  #crosshair.on .ring { border-color: rgba(93,202,165,0.95); }
  #crosshair .dot {
    position: absolute; top: 50%; left: 50%;
    width: 3px; height: 3px;
    margin: -1.5px 0 0 -1.5px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
  }

  #flash {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,220,150,0.0) 0%, rgba(255,220,150,0) 60%);
    z-index: 3;
    opacity: 0;
    transition: opacity 0.05s;
  }
  #flash.on { opacity: 1; background: radial-gradient(circle at center, rgba(255,220,150,0.35) 0%, rgba(255,220,150,0) 50%); }

  #start {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,9,8,0.7);
    backdrop-filter: blur(4px);
    z-index: 50;
  }
  #start .panel {
    background: var(--panel);
    border: 1px solid rgba(200,144,96,0.2);
    border-radius: 14px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    max-width: 420px;
  }
  #start h2 { margin: 0 0 8px; color: var(--accent); font-size: 22px; letter-spacing: 1px; }
  #start p { margin: 0 0 18px; color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  #start button { font-size: 14px; padding: 10px 24px; background: var(--accent); color: #1a1916; border: none; font-weight: 600; }
  #start button:hover { background: #d9a073; }
  #start .keys { display: flex; gap: 10px; justify-content: center; margin: 14px 0 20px; flex-wrap: wrap; }
  #start .key { font-size: 11px; color: var(--text); background: var(--panel-2); padding: 4px 10px; border-radius: 6px; border: 1px solid #3a3733; }
  #start .key b { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="flash"></div>
  <div id="crosshair"><div class="ring"></div><div class="dot"></div></div>

  <div id="hud">
    <div class="hud-card">
      <h1>BETRUNKEN</h1>
      <div class="sub">арбалет · таверна · яблоко</div>
    </div>
    <div class="hud-card stats">
      выстрелов: <b id="shots">0</b> &nbsp;·&nbsp; попаданий: <b id="hits">0</b> &nbsp;·&nbsp; <span id="acc">—</span>
    </div>
  </div>

  <div id="controls">
    <div class="ctl">
      <label>Опьянение</label>
      <input id="s-drunk" type="range" min="0" max="3" step="0.05" value="1.0">
      <span class="val" id="s-drunk-v">1.00</span>
    </div>
    <div class="ctl">
      <label>Демпф.</label>
      <input id="s-damp" type="range" min="0.5" max="10" step="0.1" value="3.5">
      <span class="val" id="s-damp-v">3.5</span>
    </div>
    <div class="ctl">
      <label>Дрейф камеры</label>
      <input id="s-cam" type="range" min="0" max="2" step="0.05" value="0.7">
      <span class="val" id="s-cam-v">0.70</span>
    </div>
    <div class="ctl">
      <label>Отдача</label>
      <input id="s-recoil" type="range" min="0" max="2" step="0.05" value="0.7">
      <span class="val" id="s-recoil-v">0.70</span>
    </div>
    <div class="ctl">
      <button id="reset">Сброс</button>
      <button id="respawn">Новое яблоко</button>
    </div>
  </div>

  <div id="loading">
    <div class="ring"></div>
    <div class="label" id="loading-label">Загрузка ассетов…</div>
  </div>

  <div id="start" style="display:none">
    <div class="panel">
      <h2>BETRUNKEN</h2>
      <p>Сбей яблоко с кружки. Прицел плавает — это всё хмель. Целься в центр и стреляй болтом из арбалета.</p>
      <div class="keys">
        <div class="key"><b>ЛКМ</b> / <b>Space</b> — выстрел</div>
        <div class="key"><b>Мышь</b> — целиться</div>
        <div class="key"><b>R</b> — новое яблоко</div>
      </div>
      <button id="start-btn">Начать</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------------------
// Audio: synthesized via WebAudio so we don't depend on external files.
// ---------------------------------------------------------------------------
const AudioFx = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function shot() {
    const ac = ensure();
    const now = ac.currentTime;
    // Sharp twang: noise burst + descending tone.
    const buf = ac.createBuffer(1, ac.sampleRate * 0.18, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / ac.sampleRate;
      const env = Math.exp(-t * 22);
      data[i] = (Math.random() * 2 - 1) * env * 0.5;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const noiseGain = ac.createGain();
    noiseGain.gain.value = 0.6;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1200;
    filter.Q.value = 1.5;
    src.connect(filter).connect(noiseGain).connect(ac.destination);
    src.start(now);

    const osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(380, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.18);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.0, now);
    og.gain.linearRampToValueAtTime(0.35, now + 0.005);
    og.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
    osc.connect(og).connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }

  function miss() {
    const ac = ensure();
    const now = ac.currentTime;
    // Thunk: low thump + small wood crack.
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0, now);
    g.gain.linearRampToValueAtTime(0.45, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.connect(g).connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.3);

    const buf = ac.createBuffer(1, ac.sampleRate * 0.08, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / ac.sampleRate;
      data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 40);
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const ng = ac.createGain();
    ng.gain.value = 0.2;
    const f = ac.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 800;
    src.connect(f).connect(ng).connect(ac.destination);
    src.start(now);
  }

  function hit() {
    const ac = ensure();
    const now = ac.currentTime;
    // Juicy splat: short noise + bright crack.
    const buf = ac.createBuffer(1, ac.sampleRate * 0.35, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / ac.sampleRate;
      const env = Math.exp(-t * 8) * (1 + 0.4 * Math.sin(t * 90));
      data[i] = (Math.random() * 2 - 1) * env * 0.6;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 2200;
    const g = ac.createGain();
    g.gain.value = 0.55;
    src.connect(f).connect(g).connect(ac.destination);
    src.start(now);

    const osc = ac.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.0, now);
    og.gain.linearRampToValueAtTime(0.25, now + 0.005);
    og.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
    osc.connect(og).connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  return { shot, miss, hit, ensure };
})();

// ---------------------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1611);
scene.fog = new THREE.Fog(0x1a1611, 12, 28);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(0, 1.55, 0);
// Anchor for the drunken positional sway: each frame the camera is offset
// from this base by low-frequency noise scaled by state.cameraDrift.
const CAMERA_BASE_POS = camera.position.clone();
// Camera is essentially static. A small base pitch puts the mug+apple near screen center.
// BASE_YAW rotates the view toward a corner of the tavern so the player sees
// two walls meeting in the background instead of a head-on flat wall.
// The reticle moves with the mouse (pointer-style), exactly like the 2D sandbox.
const BASE_PITCH = -0.06;
const BASE_YAW   =  0.55;
camera.rotation.order = 'YXZ';
camera.rotation.x = BASE_PITCH;
camera.rotation.y = BASE_YAW;

// Forward and rightward unit vectors in the XZ plane that match BASE_YAW.
// `forward` points away from the camera along its baseline gaze; `right` is
// perpendicular to it (camera-space +X).
const FORWARD_X = -Math.sin(BASE_YAW);
const FORWARD_Z = -Math.cos(BASE_YAW);
const RIGHT_X   =  Math.cos(BASE_YAW);
const RIGHT_Z   = -Math.sin(BASE_YAW);

// Lights — warm, low-poly tavern mood.
scene.add(new THREE.AmbientLight(0x6a5840, 0.7));
const hemi = new THREE.HemisphereLight(0xffd9a8, 0x2a1f15, 0.75);
scene.add(hemi);

const fire = new THREE.PointLight(0xffa040, 4.2, 14, 1.8);
fire.position.set(-3.0, 1.2, -1.5);
fire.castShadow = true;
fire.shadow.mapSize.set(512, 512);
scene.add(fire);

const window_light = new THREE.DirectionalLight(0xffe1b3, 1.3);
window_light.position.set(3, 5, -2);
window_light.castShadow = true;
window_light.shadow.mapSize.set(1024, 1024);
window_light.shadow.camera.left = -6;
window_light.shadow.camera.right = 6;
window_light.shadow.camera.top = 6;
window_light.shadow.camera.bottom = -6;
window_light.shadow.camera.near = 0.1;
window_light.shadow.camera.far = 20;
scene.add(window_light);

// Spotlight aimed at the mug+apple so the target is always clearly visible.
// Positions are derived from BASE_YAW so the cone always lands on the table
// regardless of which corner of the room we end up facing.
const targetSpot = new THREE.SpotLight(0xfff1d0, 8.0, 8, Math.PI / 6, 0.5, 1.0);
targetSpot.position.set(
  camera.position.x + FORWARD_X * 1.8,
  3.2,
  camera.position.z + FORWARD_Z * 1.8
);
const targetSpotTarget = new THREE.Object3D();
targetSpotTarget.position.set(
  camera.position.x + FORWARD_X * 3.0,
  1.0,
  camera.position.z + FORWARD_Z * 3.0
);
scene.add(targetSpot);
scene.add(targetSpotTarget);
targetSpot.target = targetSpotTarget;

// ---------------------------------------------------------------------------
// Asset loading
// ---------------------------------------------------------------------------
const loader = new GLTFLoader();
const loadingLabel = document.getElementById('loading-label');

function loadGLB(path) {
  return new Promise((resolve, reject) => {
    loader.load(path, resolve, undefined, reject);
  });
}

function enableShadows(obj) {
  obj.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => { if (m.map) m.map.colorSpace = THREE.SRGBColorSpace; });
        else if (o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
      }
    }
  });
}

// Compute bbox for any object3D
function computeBBox(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  return { box, size, center };
}

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const state = {
  shots: 0,
  hits: 0,
  appleAlive: true,
  bolts: [],         // active flying bolts
  fragments: [],     // apple fragments after a hit
  apple: null,       // current apple Object3D
  appleHitbox: null, // sphere {center, radius}
  mug: null,
  crossbow: null,
  crossbowMixer: null,
  crossbowAction: null,
  boltTemplate: null, // a clone-able bolt mesh extracted from the crossbow
  idleBolt: null,     // bolt mounted on the crossbow rail while loaded
  drunk: 1.0,
  damp: 3.5,
  cameraDrift: 0.7,
  recoilStrength: 0.7,
  cameraDriftRot: new THREE.Vector2(0, 0),
  cameraDriftVel: new THREE.Vector2(0, 0),
  stringMesh: null,
  stringRest: null,
  aim: new THREE.Vector2(0, 0),   // [-1..1] target pos on screen
  aimSmooth: new THREE.Vector2(0, 0),
  aimVel: new THREE.Vector2(0, 0),
  cameraSway: new THREE.Vector2(0, 0),
  cameraSwayVel: new THREE.Vector2(0, 0),
  recoilOffset: 0,
  recoilVel: 0,
  shooting: false,
  canShoot: true,
  t: 0,
};

// ---------------------------------------------------------------------------
// UI bindings
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function bindSlider(id, key, fmt) {
  const el = $('s-' + id), out = $('s-' + id + '-v');
  el.addEventListener('input', () => { state[key] = parseFloat(el.value); out.textContent = fmt(state[key]); });
  out.textContent = fmt(state[key]);
}
bindSlider('drunk', 'drunk', v => v.toFixed(2));
bindSlider('damp', 'damp', v => v.toFixed(1));
bindSlider('cam', 'cameraDrift', v => v.toFixed(2));
bindSlider('recoil', 'recoilStrength', v => v.toFixed(2));

function updateStats() {
  $('shots').textContent = state.shots;
  $('hits').textContent = state.hits;
  $('acc').textContent = state.shots ? Math.round(state.hits / state.shots * 100) + '%' : '—';
}

$('reset').addEventListener('click', () => { state.shots = 0; state.hits = 0; updateStats(); });
$('respawn').addEventListener('click', respawnApple);

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
window.addEventListener('mousemove', e => {
  state.aim.x = (e.clientX / window.innerWidth) * 2 - 1;
  state.aim.y = -((e.clientY / window.innerHeight) * 2 - 1);
});
window.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (document.getElementById('start').style.display !== 'none') return;
  // Ignore clicks on HUD controls
  if (e.target.closest('.ctl') || e.target.closest('.hud-card') || e.target.tagName === 'BUTTON') return;
  tryShoot();
});
window.addEventListener('keydown', e => {
  if (document.getElementById('start').style.display !== 'none') return;
  if (e.code === 'Space') { e.preventDefault(); tryShoot(); }
  if (e.code === 'KeyR') { respawnApple(); }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
// Build a rotation that maps local axes onto desired world axes.
// `fromLocal` is which local axis (+x/-x/+y/-y/+z/-z) should become which world axis.
function axisVec(name) {
  switch (name) {
    case '+x': return new THREE.Vector3(1, 0, 0);
    case '-x': return new THREE.Vector3(-1, 0, 0);
    case '+y': return new THREE.Vector3(0, 1, 0);
    case '-y': return new THREE.Vector3(0, -1, 0);
    case '+z': return new THREE.Vector3(0, 0, 1);
    case '-z': return new THREE.Vector3(0, 0, -1);
  }
}
// Rotate so local axis `forwardLocal` points to world -Z, local axis `upLocal` points to world +Y.
function alignmentQuat(forwardLocal, upLocal) {
  const fL = axisVec(forwardLocal);
  const uL = axisVec(upLocal);
  // Build a basis matrix whose columns are images of local x,y,z under the rotation we want.
  // We have constraints: R * fL = (0,0,-1), R * uL = (0,1,0).
  // Equivalently R^T has columns fL, uL, sL where sL = uL × fL? Let me just construct by inverse.
  // Build matrix M with columns = (fL, uL, fL×uL) — that's the local-frame "forward, up, side" basis.
  const sL = new THREE.Vector3().crossVectors(uL, fL);  // right-handed: side = up × forward (for -Z forward)
  // Wait. In world we want forward = -Z, up = +Y. Then side = up × forward = (0,1,0) × (0,0,-1) = (1,0,0) = +X. Good.
  // So local frame: forwardLocal corresponds to world -Z, upLocal to world +Y, sL to world +X.
  // The matrix that maps local → world: world_x_col = sL, world_y_col = uL, world_z_col = -fL.
  // i.e. R has columns (sL, uL, -fL) when expressed... actually rows of R^T are local-frame basis in world coords.
  // To get the rotation matrix R that takes a local vector to its world coord, we set:
  //   R = [ sL_w  uL_w  -fL_w ]   (as columns), where sL_w, uL_w, -fL_w are unit world basis vectors.
  // Wait this is getting muddled. Let me just construct via Matrix4.makeBasis.
  const m = new THREE.Matrix4();
  // makeBasis sets the rotation columns to xAxis, yAxis, zAxis.
  // So columns of R = (xAxis, yAxis, zAxis) in world frame, but R is rotation that maps local→world only if these are the IMAGES of local e_x, e_y, e_z under R.
  // We want R^-1: takes world → local. Hmm.
  // OK simpler approach: build the inverse mapping. R^-1 takes local → ?, ugh.
  // Let me think physically: We have an object whose intrinsic "forward" direction is fL (in its local coords).
  // After rotation R, that forward direction in world is R*fL. We want R*fL = -Z_world.
  // Similarly R*uL = +Y_world.
  // R^T * (-Z_world) = fL. R^T * (+Y_world) = uL. So columns of R^T are fL, uL, sL = ?
  // R^T column k = R^T * e_k. We have R^T * (1,0,0) = ?, R^T * (0,1,0) = uL, R^T * (0,0,-1) = fL → R^T * (0,0,1) = -fL.
  // So R^T = [ ? | uL | -fL ] columns. The first column must be unit vector perpendicular to uL and -fL with positive orientation. That's uL × (-fL) = -uL × fL.
  // For our example: uL=Y, fL=-Z → uL × fL = Y × (-Z) = -X → -uL × fL = +X. So first column = +X. Identity. Good.
  m.makeBasis(
    new THREE.Vector3().crossVectors(uL, fL).multiplyScalar(-1).normalize(),  // -uL × fL
    uL.clone(),
    fL.clone().multiplyScalar(-1)
  );
  // m is R^T. We want R = m^T.
  m.transpose();
  const q = new THREE.Quaternion().setFromRotationMatrix(m);
  return q;
}

// Auto-orient an asset by its bbox: longest axis becomes forward (-Z), smallest becomes up (+Y).
function autoOrient(obj) {
  // Center the object first.
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  obj.position.sub(center);

  const axes = [
    { name: '+x', len: size.x },
    { name: '+y', len: size.y },
    { name: '+z', len: size.z },
  ];
  axes.sort((a, b) => b.len - a.len);
  const forwardLocal = axes[0].name;  // longest = forward
  const upLocal = axes[2].name;       // smallest = up (vertical thickness)
  const wrap = new THREE.Group();
  wrap.add(obj);
  wrap.quaternion.copy(alignmentQuat(forwardLocal, upLocal));
  return { wrap, size, sorted: axes };
}

async function boot() {
  loadingLabel.textContent = 'Загрузка таверны…';
  const tavernGLB = await loadGLB('low-poly_medieval_tavern.glb');
  const tavern = tavernGLB.scene;
  enableShadows(tavern);
  const { size, center } = computeBBox(tavern);
  const scale = 12 / Math.max(size.x, size.z);
  tavern.scale.setScalar(scale);
  tavern.position.x -= center.x * scale;
  tavern.position.z -= center.z * scale;
  tavern.position.y -= (center.y - size.y / 2) * scale;
  // Push the tavern away so we look INTO it (down -Z).
  tavern.position.z -= 3.5;
  scene.add(tavern);

  loadingLabel.textContent = 'Загрузка арбалета…';
  const crossbowGLB = await loadGLB('medieval_crossbow_with_bolt.glb');
  const crossbowRaw = crossbowGLB.scene;
  enableShadows(crossbowRaw);

  // Log mesh names so we can identify parts (string, bolt, prod) if anything
  // looks off in the asset.
  const meshNames = [];
  crossbowRaw.traverse(o => { if (o.isMesh) meshNames.push(o.name || '(unnamed)'); });
  console.log('[crossbow] meshes:', meshNames);

  // Scale crossbow to a sensible first-person size.
  const cb = computeBBox(crossbowRaw);
  const cbScale = 0.55 / Math.max(cb.size.x, cb.size.y, cb.size.z);
  crossbowRaw.scale.setScalar(cbScale);

  // Auto-orient by bbox: longest axis (the stock/rail) → forward (-Z), thinnest → up.
  const oriented = autoOrient(crossbowRaw);
  const crossbowAligned = oriented.wrap;

  // First-person rig — slight offset to the right + down, very slight cant.
  const crossbowRig = new THREE.Group();
  crossbowRig.add(crossbowAligned);
  crossbowRig.position.set(0.10, -0.18, -0.55);
  crossbowRig.rotation.set(-0.02, 0.0, 0);
  camera.add(crossbowRig);
  scene.add(camera);
  state.crossbow = crossbowRig;
  state.crossbowInner = crossbowRaw;
  state.crossbowRestPos = crossbowRig.position.clone();
  state.crossbowRestRot = crossbowRig.rotation.clone();
  state.crossbowKick = 0;

  // NB: the asset's firing animation is intentionally NOT played. It launches
  // the bowstring forward along with the bolt, which makes the string fly off
  // into space when rendered without the bolt absorbing the motion. We deliver
  // the firing feel via a manual translate-and-rotate kick on the rig (see the
  // tick loop). The animation could be re-enabled later if we ever rebuild the
  // string rig, but for now stability wins over the asset's anim.

  // Extract bolt mesh from the crossbow to use as projectile.
  let candidate = null;
  const boltCandidates = [];
  crossbowRaw.traverse(o => {
    if (!o.isMesh) return;
    const n = (o.name || '').toLowerCase();
    if (n.includes('bolt') || n.includes('arrow') || n.includes('quarrel')) {
      boltCandidates.push(o);
      if (!candidate) candidate = o;
    }
  });
  if (!candidate) {
    let best = null, bestRatio = 0;
    crossbowRaw.traverse(o => {
      if (!o.isMesh) return;
      const b = new THREE.Box3().setFromObject(o);
      const s = new THREE.Vector3(); b.getSize(s);
      const longest = Math.max(s.x, s.y, s.z);
      const others = (s.x + s.y + s.z - longest) / 2 || 0.0001;
      const ratio = longest / others;
      if (ratio > bestRatio && longest > 0.05) { bestRatio = ratio; best = o; }
    });
    candidate = best;
    if (candidate) boltCandidates.push(candidate);
  }

  // Hide every pre-attached bolt in the model — we'll mount our own clean
  // copy on the crossbow rail below, so we control its position exactly.
  for (const b of boltCandidates) b.visible = false;

  // Identify the bowstring so we can freeze it in its rest pose every frame.
  // The animation in this asset launches the string forward along with the bolt,
  // which makes the string appear to "fly into space" once it leaves the prod.
  crossbowRaw.traverse(o => {
    if (!o.isMesh) return;
    const n = (o.name || '').toLowerCase();
    if (n.includes('string') || n.includes('chord') || n.includes('cord')
        || n.includes('strung') || n.includes('rope') || n.includes('wire')
        || n.includes('тетив') || n.includes('tetiv')) {
      if (!state.stringMesh) {
        state.stringMesh = o;
        state.stringRest = {
          position: o.position.clone(),
          quaternion: o.quaternion.clone(),
          scale: o.scale.clone(),
        };
      }
    }
  });

  // Build the bolt template as TWO nested groups so lookAt at fire time doesn't
  // erase our pre-rotation that aligns the bolt's long axis with -Z.
  let innerBoltGroup;
  if (candidate) {
    const bolt = candidate.clone(true);
    // `candidate` was hidden above to suppress the in-model bolts; the clone
    // inherits visible=false, so we have to restore it on every node.
    bolt.visible = true;
    bolt.traverse(o => { o.visible = true; if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); } });
    // Reset any local transform so bbox reflects pure geometry orientation.
    bolt.position.set(0, 0, 0);
    bolt.rotation.set(0, 0, 0);
    bolt.scale.set(1, 1, 1);
    const bb = new THREE.Box3().setFromObject(bolt);
    const bs = new THREE.Vector3(); bb.getSize(bs);
    const longest = Math.max(bs.x, bs.y, bs.z);
    const targetLen = 0.55;
    bolt.scale.setScalar(targetLen / longest);
    // Re-center after scaling.
    const bb2 = new THREE.Box3().setFromObject(bolt);
    const bc = new THREE.Vector3(); bb2.getCenter(bc);
    bolt.position.sub(bc);
    // Pre-rotate so its longest axis aligns with -Z.
    innerBoltGroup = new THREE.Group();
    innerBoltGroup.add(bolt);
    if (bs.x >= bs.y && bs.x >= bs.z) innerBoltGroup.rotation.y = Math.PI / 2;
    else if (bs.y >= bs.x && bs.y >= bs.z) innerBoltGroup.rotation.x = -Math.PI / 2;
  } else {
    // Procedural fallback.
    innerBoltGroup = new THREE.Group();
    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.012, 0.55, 10),
      new THREE.MeshStandardMaterial({ color: 0x8a6a44, roughness: 0.85 })
    );
    shaft.rotation.x = Math.PI / 2;
    const tip = new THREE.Mesh(
      new THREE.ConeGeometry(0.022, 0.08, 10),
      new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.6, roughness: 0.35 })
    );
    tip.rotation.x = -Math.PI / 2;
    tip.position.z = -0.31;
    const fletch = new THREE.Mesh(
      new THREE.BoxGeometry(0.07, 0.0015, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xc0392b })
    );
    fletch.position.z = 0.22;
    const fletch2 = fletch.clone();
    fletch2.rotation.z = Math.PI / 2;
    innerBoltGroup.add(shaft, tip, fletch, fletch2);
  }
  innerBoltGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });
  // Outer group — this is the one lookAt() will rotate at fire time.
  const outerBoltGroup = new THREE.Group();
  outerBoltGroup.add(innerBoltGroup);
  state.boltTemplate = outerBoltGroup;

  // Mount a single idle bolt on the crossbow rig. The rig sits at
  // (0.10, -0.18, -0.55) relative to the camera (offset to the lower-right
  // so the crossbow reads as held in the hands), and the model's bbox
  // center is pulled off the rail by the wide prod arms. We place the bolt
  // in rig-local space such that, after the rig offset, it ends up roughly
  // centered horizontally on screen and just below the crosshair — i.e.
  // visually on the middle of the rail.
  const idleBolt = state.boltTemplate.clone(true);
  idleBolt.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  // World pos ≈ (-0.12, -0.10, -0.60): a touch left of screen center,
  // lifted off the stock, and pulled back toward the bowstring so the
  // bolt's nock visibly sits against the string instead of floating
  // halfway down the rail.
  idleBolt.position.set(-0.22, 0.08, -0.05);
  // The bolt template's tip sits at local +Z (because Object3D.lookAt aims
  // +Z at the flight target). The rig's forward is -Z, so without this
  // flip the tip would point back at the player.
  idleBolt.rotation.y = Math.PI;
  crossbowRig.add(idleBolt);
  state.idleBolt = idleBolt;

  loadingLabel.textContent = 'Загрузка яблока…';
  const appleGLB = await loadGLB('Shark apple.glb');
  state.appleTemplate = appleGLB.scene;
  enableShadows(state.appleTemplate);

  buildMugAndApple();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('start').style.display = 'flex';
  document.getElementById('start-btn').addEventListener('click', () => {
    AudioFx.ensure();
    document.getElementById('start').style.display = 'none';
  });
}

// ---------------------------------------------------------------------------
// Trestle table + mug + apple (matches the reference image composition)
// ---------------------------------------------------------------------------
const TARGET_DIST = 3.0;             // distance in front of camera
const TABLE_TOP_Y = 1.25;            // sawhorse plank height — chest height
const MUG_BASE_Y  = TABLE_TOP_Y + 0.02;
const MUG_HEIGHT  = 0.45;            // tall tankard so the apple ends up near eye level
const APPLE_SIZE  = 0.12;            // small fruit perched on the mug
const FOCUS_X     = -0.1;            // slight off-center, like the reference

function buildSawhorse() {
  const wood = new THREE.MeshStandardMaterial({ color: 0xa37448, roughness: 0.88 });
  const plank = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.06, 0.42), wood);
  plank.position.y = TABLE_TOP_Y;
  plank.castShadow = true; plank.receiveShadow = true;

  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, TABLE_TOP_Y, 0.06), wood);
  leg.castShadow = true; leg.receiveShadow = true;

  const trestle = new THREE.Group();
  // Two pairs of crossed legs
  for (const xs of [-0.55, 0.55]) {
    const l1 = leg.clone();
    l1.position.set(xs - 0.12, TABLE_TOP_Y / 2 - 0.03, 0);
    l1.rotation.z = 0.18;
    const l2 = leg.clone();
    l2.position.set(xs + 0.12, TABLE_TOP_Y / 2 - 0.03, 0);
    l2.rotation.z = -0.18;
    trestle.add(l1, l2);
    const cross = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.05, 0.05), wood);
    cross.position.set(xs, TABLE_TOP_Y - 0.18, 0);
    trestle.add(cross);
  }
  trestle.add(plank);
  return trestle;
}

function buildMug() {
  const mug = new THREE.Group();
  const matWood = new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 0.9 });
  const matRim  = new THREE.MeshStandardMaterial({ color: 0x4a2f17, roughness: 0.85, metalness: 0.2 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.062, MUG_HEIGHT, 22), matWood);
  body.position.y = MUG_HEIGHT / 2;
  body.castShadow = true; body.receiveShadow = true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.078, 0.008, 8, 22), matRim);
  rim.position.y = MUG_HEIGHT - 0.005;
  rim.rotation.x = Math.PI / 2;
  const baseRing = new THREE.Mesh(new THREE.TorusGeometry(0.065, 0.008, 8, 22), matRim);
  baseRing.position.y = 0.005;
  baseRing.rotation.x = Math.PI / 2;
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 8, 16, Math.PI), matWood);
  handle.position.set(0.085, MUG_HEIGHT / 2, 0);
  handle.rotation.y = Math.PI / 2;
  const foam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.073, 0.073, 0.015, 22),
    new THREE.MeshStandardMaterial({ color: 0xf2e6c2, roughness: 0.65 })
  );
  foam.position.y = MUG_HEIGHT - 0.01;
  mug.add(body, rim, baseRing, handle, foam);
  mug.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return mug;
}

let SAWHORSE_POS;
let MUG_POS;
let APPLE_POS;

function buildMugAndApple() {
  // Anchor the whole composition relative to the camera's baseline gaze
  // (BASE_YAW), so when we rotate the view toward a corner the target stays
  // dead-ahead. FOCUS_X is applied along the camera's right vector.
  const cx = camera.position.x;
  const cz = camera.position.z;
  const baseX = cx + FORWARD_X * TARGET_DIST + RIGHT_X * FOCUS_X;
  const baseZ = cz + FORWARD_Z * TARGET_DIST + RIGHT_Z * FOCUS_X;
  SAWHORSE_POS = new THREE.Vector3(baseX, 0, baseZ);
  MUG_POS      = new THREE.Vector3(baseX, MUG_BASE_Y, baseZ);
  // Rest the apple on top of the foam — its bottom touches MUG top, so the
  // center is exactly APPLE_SIZE / 2 above it.
  APPLE_POS    = new THREE.Vector3(baseX, MUG_BASE_Y + MUG_HEIGHT + APPLE_SIZE * 0.5, baseZ);

  const trestle = buildSawhorse();
  trestle.position.copy(SAWHORSE_POS);
  trestle.rotation.y = BASE_YAW;
  scene.add(trestle);

  const mug = buildMug();
  mug.position.copy(MUG_POS);
  scene.add(mug);
  state.mug = mug;

  spawnApple();
}

function spawnApple() {
  const apple = state.appleTemplate.clone(true);
  apple.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      o.material = o.material.clone();
    }
  });
  const ab = computeBBox(apple);
  const s = APPLE_SIZE / Math.max(ab.size.x, ab.size.y, ab.size.z);
  apple.scale.setScalar(s);
  // Recompute bbox after scaling so we can rest its bottom on the foam.
  apple.position.copy(APPLE_POS);
  scene.add(apple);
  state.apple = apple;
  state.appleAlive = true;
  state.appleHitbox = { center: apple.position.clone(), radius: APPLE_SIZE * 0.55 };
}

function respawnApple() {
  if (state.apple) { scene.remove(state.apple); state.apple = null; }
  // Clear fragments
  for (const f of state.fragments) scene.remove(f.obj);
  state.fragments = [];
  spawnApple();
}

// ---------------------------------------------------------------------------
// Shooting
// ---------------------------------------------------------------------------
function tryShoot() {
  if (!state.boltTemplate) return;
  if (!state.canShoot) return;
  state.canShoot = false;
  setTimeout(() => state.canShoot = true, 500);

  AudioFx.shot();
  AudioFx.ensure();

  // Manual crossbow kick — replaces the broken built-in animation.
  state.crossbowKick = 1.0;

  // Hide the bolt that sits on the crossbow rail, then restore it ~1s later so
  // the weapon visibly "reloads".
  if (state.idleBolt) {
    state.idleBolt.visible = false;
    setTimeout(() => {
      if (state.idleBolt) state.idleBolt.visible = true;
    }, 1000);
  }

  // Recoil — kicks the camera pitch up and adds a small jitter.
  state.recoilVel -= 1.6 * state.recoilStrength;
  state.cameraSwayVel.x += (Math.random() - 0.5) * 0.4 * state.recoilStrength;
  state.cameraSwayVel.y += (Math.random() - 0.5) * 0.3 * state.recoilStrength;

  // Muzzle flash
  const fl = document.getElementById('flash');
  fl.classList.add('on');
  setTimeout(() => fl.classList.remove('on'), 70);

  // Spawn bolt with the camera's current forward direction.
  const bolt = state.boltTemplate.clone(true);
  bolt.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  // Add a translucent streak behind the bolt so the flight is visually obvious.
  const streak = new THREE.Mesh(
    new THREE.CylinderGeometry(0.004, 0.0005, 1.1, 8),
    new THREE.MeshBasicMaterial({ color: 0xffe6a8, transparent: true, opacity: 0.55, depthWrite: false })
  );
  streak.rotation.x = -Math.PI / 2;   // align cylinder along local Z
  streak.position.z = 0.55;           // sits behind the bolt (bolt forward = -Z)
  bolt.add(streak);
  scene.add(bolt);

  // Start position: world-space center of the idle bolt sitting on the
  // crossbow rail, so the projectile visually emerges from the middle of
  // the weapon. Fallback to a hand-tuned offset if no idle bolt exists.
  let startPos;
  if (state.idleBolt) {
    state.idleBolt.updateWorldMatrix(true, false);
    startPos = new THREE.Vector3().setFromMatrixPosition(state.idleBolt.matrixWorld);
  } else {
    const muzzleLocal = new THREE.Vector3(0.02, -0.08, -0.85);
    startPos = muzzleLocal.clone().applyMatrix4(camera.matrixWorld);
  }
  bolt.position.copy(startPos);

  // Direction: from the MUZZLE to the point the reticle is on, NOT simply
  // the camera's forward vector. Because the muzzle sits below/left of the
  // camera, firing parallel to the line of sight causes parallax — the
  // bolt arrives below the crosshair at any finite range. Converge the
  // trajectory at the actual target distance (closest point on the camera
  // ray to the apple, or a sensible default if there's no apple) so the
  // bolt passes exactly through the reticle at the target.
  const aimDir = getAimRayDir();
  let convergeDist = 5.0;
  if (state.appleHitbox) {
    const toApple = state.appleHitbox.center.clone().sub(camera.position);
    convergeDist = Math.max(1.5, toApple.dot(aimDir));
  }
  const aimPoint = camera.position.clone().add(aimDir.clone().multiplyScalar(convergeDist));
  const dir = aimPoint.clone().sub(startPos).normalize();
  bolt.lookAt(startPos.clone().add(dir));

  state.shots++;
  updateStats();

  // Hit test: ray vs apple sphere.
  let willHit = false;
  let hitPoint = null;
  if (state.appleAlive && state.appleHitbox) {
    const oc = startPos.clone().sub(state.appleHitbox.center);
    const b = oc.dot(dir);
    const c = oc.dot(oc) - state.appleHitbox.radius * state.appleHitbox.radius;
    const disc = b * b - c;
    if (disc >= 0) {
      const t = -b - Math.sqrt(disc);
      if (t > 0) {
        willHit = true;
        hitPoint = startPos.clone().add(dir.clone().multiplyScalar(t));
      }
    }
  }

  state.bolts.push({
    obj: bolt,
    pos: startPos.clone(),
    dir: dir.clone(),
    speed: 13,
    life: 3.0,
    willHit,
    hitPoint,
    resolved: false,
  });
}

const _raycaster = new THREE.Raycaster();
function getAimRayDir() {
  // FPS-style aim: the crosshair is fixed at screen center, the camera carries
  // both the mouse-driven yaw/pitch and the drunken drift. Casting at NDC (0,0)
  // returns the camera's forward direction, which is what the bolt should follow.
  _raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  return _raycaster.ray.direction.clone();
}

// ---------------------------------------------------------------------------
// Apple shatter
// ---------------------------------------------------------------------------
function shatterApple(impactPoint, impactDir) {
  if (!state.apple) return;
  const origin = state.apple.position.clone();
  // Collect base meshes from the apple
  const meshes = [];
  state.apple.traverse(o => { if (o.isMesh) meshes.push(o); });

  const NUM = 22;
  for (let i = 0; i < NUM; i++) {
    const src = meshes[i % meshes.length];
    if (!src) break;
    // Use a small chunk geometry — icosahedron pieces in the apple color.
    let color = 0xc0392b;
    if (src.material && src.material.color) color = src.material.color.getHex();
    const size = 0.012 + Math.random() * 0.022;
    const geom = i % 3 === 0
      ? new THREE.IcosahedronGeometry(size, 0)
      : (i % 3 === 1 ? new THREE.TetrahedronGeometry(size, 0) : new THREE.BoxGeometry(size, size, size));
    const mat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.6,
      flatShading: true,
    });
    const piece = new THREE.Mesh(geom, mat);
    piece.castShadow = true;
    // Start near impact point with random scatter
    piece.position.copy(origin).add(new THREE.Vector3(
      (Math.random() - 0.5) * 0.08,
      (Math.random() - 0.5) * 0.08,
      (Math.random() - 0.5) * 0.08,
    ));
    // Velocity: outward from origin + bolt push + upward kick
    const out = piece.position.clone().sub(origin).normalize();
    const speed = 2 + Math.random() * 2.5;
    const v = out.multiplyScalar(speed);
    v.add(impactDir.clone().multiplyScalar(1.6 + Math.random()));
    v.y += 1.5 + Math.random() * 1.5;
    const angVel = new THREE.Vector3(
      (Math.random() - 0.5) * 18,
      (Math.random() - 0.5) * 18,
      (Math.random() - 0.5) * 18,
    );
    scene.add(piece);
    state.fragments.push({ obj: piece, vel: v, ang: angVel, life: 2.2 });
  }

  // Juice spray — small bright particles
  for (let i = 0; i < 14; i++) {
    const drop = new THREE.Mesh(
      new THREE.SphereGeometry(0.008 + Math.random() * 0.008, 5, 5),
      new THREE.MeshStandardMaterial({ color: 0xe24b4a, emissive: 0x661111, emissiveIntensity: 0.4 })
    );
    drop.position.copy(origin);
    const v = new THREE.Vector3(
      (Math.random() - 0.5) * 4,
      Math.random() * 3 + 1.5,
      (Math.random() - 0.5) * 4,
    );
    v.add(impactDir.clone().multiplyScalar(0.5));
    scene.add(drop);
    state.fragments.push({ obj: drop, vel: v, ang: new THREE.Vector3(), life: 1.6 });
  }

  scene.remove(state.apple);
  state.apple = null;
  state.appleAlive = false;
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  state.t += dt;

  // FPS-style camera aim, with the SIGN CORRECTED so mouse-right = look-right.
  //
  // In Three.js (right-handed, camera looks down -Z) positive yaw rotates the
  // view to the LEFT — that's what made the previous build feel inverted.
  // We negate the X-mouse mapping so a mouse drag to the right produces the
  // negative yaw needed to look right.
  //
  // Drunken drift is a separate noise added on top of the mouse target, just
  // like the 2D sandbox's cam.x/cam.y: it makes the world wobble even when
  // the player holds the mouse perfectly still.
  const t = state.t;
  const drift = state.drunk;
  const AIM_YAW   = 0.55;   // how many radians at mouse edges (~31°)
  const AIM_PITCH = 0.40;   // ~23° max pitch
  const camAimX = -state.aim.x * AIM_YAW;     // mouse right → yaw < 0 → look right ✓
  const camAimY =  state.aim.y * AIM_PITCH;   // mouse up    → pitch > 0 → look up  ✓

  // Spring + damping into camera rotation. This produces the "lag" between the
  // mouse and where the camera actually ends up — the drunk feel.
  const targetYaw   = camAimX;
  const targetPitch = camAimY;
  state.aimVel.x += (targetYaw   - state.aimSmooth.x) * 16 * dt;
  state.aimVel.y += (targetPitch - state.aimSmooth.y) * 16 * dt;
  const damp = Math.exp(-state.damp * dt);
  state.aimVel.multiplyScalar(damp);
  state.aimSmooth.x += state.aimVel.x * dt;
  state.aimSmooth.y += state.aimVel.y * dt;

  // Fast micro-jitter on top — "tipsy" feel.
  const baseSwayX = Math.sin(t * 4.1) * 0.006 * drift;
  const baseSwayY = Math.cos(t * 3.7 + 0.5) * 0.005 * drift;
  state.cameraSwayVel.x += -(state.cameraSway.x - baseSwayX) * 18 * dt;
  state.cameraSwayVel.y += -(state.cameraSway.y - baseSwayY) * 18 * dt;
  state.cameraSwayVel.multiplyScalar(Math.exp(-5 * dt));
  state.cameraSway.x += state.cameraSwayVel.x * dt;
  state.cameraSway.y += state.cameraSwayVel.y * dt;

  // Recoil pitch kick (decays back to zero).
  state.recoilVel += -state.recoilOffset * 30 * dt;
  state.recoilVel *= Math.exp(-6 * dt);
  state.recoilOffset += state.recoilVel * dt;

  // Drunken POSITIONAL sway — the player's body shifts on his feet because
  // his vestibular system is fried, so his eyes wander around the anchor
  // point even when he stands still. Independent multi-octave noise per
  // axis; scaled by state.cameraDrift. At max (slider=2) this swings
  // roughly ±30 cm side-to-side with ~5-second primary period, which
  // reads clearly as a body sway without being nauseating.
  const swayX = Math.sin(t * 1.10)        * 0.6
              + Math.cos(t * 2.30 + 1.3)  * 0.3
              + Math.sin(t * 4.70 + 2.4)  * 0.15;
  const swayZ = Math.cos(t * 0.95 + 0.8)  * 0.6
              + Math.sin(t * 2.10 + 2.1)  * 0.3
              + Math.cos(t * 4.10 + 0.4)  * 0.15;
  const swayY = Math.sin(t * 1.60 + 2.0)  * 0.4
              + Math.cos(t * 3.10 + 0.9)  * 0.2;
  camera.position.x = CAMERA_BASE_POS.x + swayX * state.cameraDrift * 0.15;
  camera.position.z = CAMERA_BASE_POS.z + swayZ * state.cameraDrift * 0.15;
  camera.position.y = CAMERA_BASE_POS.y + swayY * state.cameraDrift * 0.07;

  // Compose final camera orientation.
  camera.rotation.y = BASE_YAW + state.aimSmooth.x + state.cameraSway.x;
  camera.rotation.x = BASE_PITCH + state.aimSmooth.y + state.cameraSway.y + state.recoilOffset * 0.10;

  // Manual recoil shake on the crossbow rig (replaces the broken built-in animation).
  if (state.crossbowKick > 0) {
    state.crossbowKick = Math.max(0, state.crossbowKick - dt * 4.0);
    const k = state.crossbowKick;
    state.crossbow.position.z = state.crossbowRestPos.z + 0.08 * k;
    state.crossbow.rotation.x = state.crossbowRestRot.x - 0.18 * k;
  }

  // The asset's built-in firing animation moves the bowstring forward along
  // with the bolt (the string visibly "flies into space"). We intentionally
  // don't run the mixer — the model stays in its bind/rest pose with the
  // string in place, and the firing feel is delivered by `state.crossbowKick`
  // above (a manual translate-back-and-rotate kick on the rig).

  // Update bolts
  for (const b of state.bolts) {
    const step = b.dir.clone().multiplyScalar(b.speed * dt);
    const next = b.pos.clone().add(step);
    // Resolve hit if we cross the hit point.
    if (b.willHit && !b.resolved && b.hitPoint) {
      const before = b.pos.clone().sub(b.hitPoint).dot(b.dir);
      const after = next.clone().sub(b.hitPoint).dot(b.dir);
      if (before <= 0 && after >= 0) {
        b.resolved = true;
        b.obj.position.copy(b.hitPoint);
        if (state.appleAlive) {
          state.hits++; updateStats();
          AudioFx.hit();
          shatterApple(b.hitPoint, b.dir);
        }
        // Remove bolt shortly after impact.
        b.life = 0.05;
      }
    }
    b.pos.copy(next);
    b.obj.position.copy(b.pos);
    b.obj.lookAt(b.pos.clone().add(b.dir));
    b.life -= dt;
  }
  // Miss sound: when an unresolved bolt's first life-second elapses without hit.
  for (const b of state.bolts) {
    if (!b.resolved && !b.missPlayed && b.life < 1.9) {
      // Only play miss if we know we won't hit.
      if (!b.willHit) {
        AudioFx.miss();
        b.missPlayed = true;
      }
    }
  }
  state.bolts = state.bolts.filter(b => {
    if (b.life <= 0) { scene.remove(b.obj); return false; }
    return true;
  });

  // Update fragments
  for (const f of state.fragments) {
    f.vel.y -= 9.8 * dt;
    f.obj.position.addScaledVector(f.vel, dt);
    f.obj.rotation.x += f.ang.x * dt;
    f.obj.rotation.y += f.ang.y * dt;
    f.obj.rotation.z += f.ang.z * dt;
    // Bounce on the trestle plank
    const plankY = TABLE_TOP_Y + 0.035;
    if (f.obj.position.y < plankY
        && Math.abs(f.obj.position.x - SAWHORSE_POS.x) < 0.7
        && Math.abs(f.obj.position.z - SAWHORSE_POS.z) < 0.21) {
      f.obj.position.y = plankY;
      f.vel.y = -f.vel.y * 0.35;
      f.vel.x *= 0.7; f.vel.z *= 0.7;
    }
    // Ground
    if (f.obj.position.y < 0.02) {
      f.obj.position.y = 0.02;
      f.vel.y = -f.vel.y * 0.25;
      f.vel.x *= 0.6; f.vel.z *= 0.6;
    }
    f.life -= dt;
  }
  state.fragments = state.fragments.filter(f => {
    if (f.life <= 0) {
      // Fade by shrinking
      f.obj.scale.multiplyScalar(0.9);
      if (f.obj.scale.x < 0.05) { scene.remove(f.obj); return false; }
    }
    return true;
  });

  // Crosshair color: green if the reticle ray actually hits the apple.
  const ch = document.getElementById('crosshair');
  if (state.appleAlive && state.appleHitbox) {
    const startPos = new THREE.Vector3();
    camera.getWorldPosition(startPos);
    const dir = getAimRayDir();
    const oc = startPos.clone().sub(state.appleHitbox.center);
    const bd = oc.dot(dir);
    const c = oc.dot(oc) - state.appleHitbox.radius * state.appleHitbox.radius;
    const disc = bd * bd - c;
    if (disc >= 0 && -bd - Math.sqrt(disc) > 0) ch.classList.add('on');
    else ch.classList.remove('on');
  } else {
    ch.classList.remove('on');
  }

  // Soft fireplace flicker
  fire.intensity = 3.6 + Math.sin(t * 9.0) * 0.6 + Math.sin(t * 17) * 0.3;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

boot().then(() => requestAnimationFrame(tick)).catch(err => {
  console.error(err);
  loadingLabel.textContent = 'Ошибка загрузки: ' + err.message;
});
</script>
</body>
</html>
